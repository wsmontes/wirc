name: Wirc
options:
  bundleIdPrefix: com.wirc
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  Wirc:
    type: application
    platform: iOS
    sources:
      - path: WircApp
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wirc.wirc
        INFOPLIST_FILE: WircApp/App/Info.plist
        DEVELOPMENT_TEAM: 955573A4YH
        CODE_SIGN_STYLE: Automatic

  WircShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: WircShareExtension
      - path: WircApp/Infrastructure/Feed/FeedFetcher.swift
      - path: WircApp/Infrastructure/Feed/FeedSubscriptionStore.swift
      - path: WircApp/Infrastructure/Feed/FeedSubscription.swift
      - path: WircApp/Infrastructure/Feed/FeedItem.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wirc.wirc.ShareExtension
        INFOPLIST_FILE: WircShareExtension/Info.plist
        DEVELOPMENT_TEAM: 955573A4YH
        CODE_SIGN_STYLE: Automatic
